name: Build FlekDeck IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Show project information
        run: |
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -list

      - name: Build FlekDeck
        run: |
          rm -rf "$RUNNER_TEMP/FlekDeckBuild"

          xcodebuild \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/FlekDeckBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built application
        run: |
          echo "Searching for .app files..."

          find "$RUNNER_TEMP/FlekDeckBuild" \
            -type d \
            -name "*.app" \
            -print

      - name: Create IPA
        run: |
          APP_PATH=$(find \
            "$RUNNER_TEMP/FlekDeckBuild/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was found."
            echo ""
            echo "Release directory:"
            ls -la \
              "$RUNNER_TEMP/FlekDeckBuild/Build/Products/Release-iphoneos" \
              || true
            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          zip -r -q FlekDeck.ipa Payload

          echo ""
          echo "================================="
          echo "IPA CREATED SUCCESSFULLY"
          echo "================================="
          ls -lh FlekDeck.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-IPA
          path: ${{ runner.temp }}/FlekDeck.ipa
          if-no-files-found: error
