name: Build FlekDeck IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Show project information
        run: |
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Available schemes:"
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -list

      - name: Build FlekDeck
        run: |
          rm -rf "$RUNNER_TEMP/FlekDeckBuild"

          xcodebuild \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/FlekDeckBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate FlekDeck app
        run: |
          echo "Searching for built .app..."

          find "$RUNNER_TEMP/FlekDeckBuild" \
            -type d \
            -name "*.app" \
            -print

      - name: Create IPA
        run: |
          APP_PATH=$(find \
            "$RUNNER_TEMP/FlekDeckBuild/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find the built .app"
            echo ""
            echo "Contents of Release-iphoneos:"
            ls -la "$RUNNER_TEMP/FlekDeckBuild/Build/Products/Release-iphoneos" || true
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          zip -r -q FlekDeck.ipa Payload

          echo ""
          echo "IPA created:"
          ls -lh FlekDeck.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-IPA
          path: ${{ runner.temp }}/FlekDeck.ipa
          if-no-files-found: error
